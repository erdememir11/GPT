<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <rect width="100%" height="100%" fill="white"/>

  <text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">
    AGV UWB-TDOA EKF Tracking Scenario
  </text>

  <!-- Coordinate transform: outer field 500x300 mapped to x=100..800, y=450..90 -->
  <rect x="100" y="90" width="700" height="360" fill="none" stroke="black" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="450" y="475" text-anchor="middle" font-family="Arial" font-size="16">Outer surveillance field: 500 m × 300 m</text>

  <!-- Inner track: left 50, bottom 50, width 400, height 200 -->
  <!-- mapped x = 100 + x*1.4, y = 450 - y*1.2 -->
  <rect x="170" y="150" width="560" height="240" fill="none" stroke="black" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="450" y="142" text-anchor="middle" font-family="Arial" font-size="15">Inner AGV track: perimeter 1200 m</text>

  <!-- Sensors -->
  <polygon points="100,450 90,470 110,470" fill="black"/>
  <text x="115" y="443" font-family="Arial" font-size="16">S0</text>

  <polygon points="800,450 790,470 810,470" fill="black"/>
  <text x="815" y="443" font-family="Arial" font-size="16">S1</text>

  <polygon points="800,90 790,110 810,110" fill="black"/>
  <text x="815" y="88" font-family="Arial" font-size="16">S2</text>

  <polygon points="100,90 90,110 110,110" fill="black"/>
  <text x="115" y="88" font-family="Arial" font-size="16">S3</text>

  <!-- Vehicle start and direction -->
  <circle cx="170" cy="390" r="8" fill="black"/>
  <text x="185" y="407" font-family="Arial" font-size="15">Start</text>

  <!-- Direction arrows clockwise: up -> right -> down -> left -->
  <line x1="170" y1="360" x2="170" y2="200" stroke="black" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="230" y1="150" x2="670" y2="150" stroke="black" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="190" x2="730" y2="340" stroke="black" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="670" y1="390" x2="230" y2="390" stroke="black" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="black"/>
    </marker>
  </defs>

  <!-- TDOA concept lines -->
  <circle cx="350" cy="150" r="7" fill="white" stroke="black" stroke-width="2"/>
  <text x="363" y="145" font-family="Arial" font-size="15">AGV</text>
  <line x1="350" y1="150" x2="100" y2="450" stroke="gray" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="350" y1="150" x2="800" y2="450" stroke="gray" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="350" y1="150" x2="800" y2="90" stroke="gray" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="350" y1="150" x2="100" y2="90" stroke="gray" stroke-width="1.5" stroke-dasharray="5 5"/>

  <text x="450" y="515" text-anchor="middle" font-family="Arial" font-size="14">
    TDOA measurements are modeled as range differences relative to reference sensor S0.
  </text>
</svg>
